name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:client
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e && npm run e2e:events && npm run e2e:auth && npm run e2e:projects
      - run: npm audit --omit=dev --audit-level=high
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hackconnect:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "hackconnect:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
