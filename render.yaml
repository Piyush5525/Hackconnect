# Render Blueprint: the BACKEND (API + WebSockets + data). The frontend is deployed separately on Vercel (see vercel.json and docs/DEPLOY.md).
#
# Deploy: push this repo to GitHub, then in Render: New > Blueprint > pick the repo. Fill the prompts marked "sync: false".
# The backend keeps its data in one file on disk, so it must run as a single instance with a persistent disk (a disk needs a paid plan).
services:
  - type: web
    name: hackconnect
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks are not available on the free plan
    region: oregon           # pick the region closest to your users (it cannot be changed later)
    numInstances: 1          # do not scale out: the state file belongs to one instance
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: hackconnect-data
      mountPath: /app/.hackconnect   # state.json, backups and generated keys live here
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HACKCONNECT_SECURE_COOKIES
        value: "true"
      - key: HACKCONNECT_LOG
        value: json
      - key: HACKCONNECT_AGENT_PROVIDER
        value: demo
      # The address people open: your VERCEL address, e.g. https://hackconnect.vercel.app (or your custom domain).
      # Used for sign-in callbacks, emailed links and the assistant launcher. It is also the only site allowed to open live sockets.
      - key: HACKCONNECT_BASE_URL
        sync: false
      # This backend's own address, e.g. https://hackconnect-api.onrender.com. Used by the CLI bridge / VS Code extension downloads
      # (they talk to the backend directly because Vercel cannot carry WebSockets).
      - key: HACKCONNECT_API_URL
        sync: false
      # Requests arrive through Vercel and Render's proxy: use the visitor address they report for rate limits.
      - key: HACKCONNECT_TRUST_PROXY
        value: "true"
      # Encrypts stored GitHub tokens. Generated once by Render; do not change it later or stored tokens become unreadable.
      - key: HACKCONNECT_MASTER_KEY
        generateValue: true
      # Optional: real confirmation / password-reset emails (leave empty to print links in the logs instead).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional: "Sign in with GitHub / Google".
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
