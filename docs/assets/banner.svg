<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="HackConnect: build hackathon projects together, live">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1210"/><stop offset="1" stop-color="#101a16"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4f99d"/><stop offset="1" stop-color="#7fbd45"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58e0aa"/><stop offset="1" stop-color="#b9f07c"/></linearGradient>
    <radialGradient id="b1" cx="0.2" cy="0.1" r="0.7"><stop offset="0" stop-color="#58e0aa" stop-opacity=".34"/><stop offset="1" stop-color="#58e0aa" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#5a8cff" stop-opacity=".30"/><stop offset="1" stop-color="#5a8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="0.65" cy="0.05" r="0.5"><stop offset="0" stop-color="#b982ff" stop-opacity=".22"/><stop offset="1" stop-color="#b982ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="26" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="26" fill="url(#b1)"/><rect width="1280" height="380" rx="26" fill="url(#b2)"/><rect width="1280" height="380" rx="26" fill="url(#b3)"/>
  <rect x="1" y="1" width="1278" height="378" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- logo mark -->
  <g transform="translate(96 78) scale(2.3)">
    <rect width="64" height="64" rx="16" fill="url(#g)"/>
    <rect x="15" y="14" width="9" height="36" rx="4.5" fill="#10170d"/><rect x="40" y="14" width="9" height="36" rx="4.5" fill="#10170d"/><rect x="22" y="29" width="20" height="6" fill="#10170d"/>
    <circle cx="32" cy="32" r="7.5" fill="#d4f99d" stroke="#10170d" stroke-width="3.5"/><circle cx="32" cy="32" r="2.2" fill="#10170d"/>
  </g>
  <text x="270" y="170" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="800" fill="#f2f7f4" letter-spacing="-2">hack<tspan fill="url(#word)">connect</tspan></text>
  <text x="272" y="222" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="27" fill="#a9b8b1">Build hackathon projects together, live.</text>

  <!-- feature pills -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(96 292)"><rect width="196" height="42" rx="21" fill="#58e0aa" fill-opacity=".13" stroke="#58e0aa" stroke-opacity=".45"/><text x="98" y="27" text-anchor="middle" fill="#58e0aa">Live co-editing</text></g>
    <g transform="translate(308 292)"><rect width="170" height="42" rx="21" fill="#5a8cff" fill-opacity=".13" stroke="#5a8cff" stroke-opacity=".45"/><text x="85" y="27" text-anchor="middle" fill="#9db8ff">Voice &amp; video</text></g>
    <g transform="translate(494 292)"><rect width="208" height="42" rx="21" fill="#b982ff" fill-opacity=".13" stroke="#b982ff" stroke-opacity=".45"/><text x="104" y="27" text-anchor="middle" fill="#d2b0ff">AI with approval</text></g>
    <g transform="translate(718 292)"><rect width="180" height="42" rx="21" fill="#f5c84b" fill-opacity=".12" stroke="#f5c84b" stroke-opacity=".45"/><text x="90" y="27" text-anchor="middle" fill="#f5c84b">Hackathons</text></g>
    <g transform="translate(914 292)"><rect width="216" height="42" rx="21" fill="#ff8d8d" fill-opacity=".12" stroke="#ff8d8d" stroke-opacity=".45"/><text x="108" y="27" text-anchor="middle" fill="#ff9f9f">Judging &amp; replay</text></g>
  </g>

  <!-- decorative editor window -->
  <g transform="translate(900 70)">
    <rect width="300" height="170" rx="16" fill="#0b100e" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="22" cy="22" r="5" fill="#ff6b6b"/><circle cx="40" cy="22" r="5" fill="#f5c84b"/><circle cx="58" cy="22" r="5" fill="#58e0aa"/>
    <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="14">
      <text x="22" y="62" fill="#7a8a83">1</text><text x="46" y="62" fill="#9db8ff">const</text><text x="94" y="62" fill="#e6eee9">room</text><text x="134" y="62" fill="#e6eee9">=</text><text x="150" y="62" fill="#b9f07c">live</text><text x="184" y="62" fill="#e6eee9">();</text>
      <text x="22" y="86" fill="#7a8a83">2</text><text x="46" y="86" fill="#d2b0ff">room</text><text x="86" y="86" fill="#e6eee9">.join(</text><text x="142" y="86" fill="#f5c84b">"team"</text><text x="190" y="86" fill="#e6eee9">);</text>
      <text x="22" y="110" fill="#7a8a83">3</text><text x="46" y="110" fill="#7a8a83">// everyone sees this</text>
      <text x="22" y="134" fill="#7a8a83">4</text><text x="46" y="134" fill="#9db8ff">await</text><text x="96" y="134" fill="#e6eee9">ship();</text>
    </g>
    <rect x="132" y="118" width="2" height="20" fill="#58e0aa"/><rect x="132" y="108" width="62" height="14" rx="7" fill="#58e0aa"/><text x="163" y="119" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#0b1210">Maya</text>
    <rect x="196" y="76" width="2" height="20" fill="#b982ff"/><rect x="196" y="66" width="54" height="14" rx="7" fill="#b982ff"/><text x="223" y="77" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#0b1210">Arjun</text>
  </g>
</svg>
